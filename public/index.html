<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="S.I.R.I.U.S. - Personal Assistant Engine">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/sirius-logo-static.svg">
  <meta name="theme-color" content="#00c6ff">
  <title>S.I.R.I.U.S. Engine</title>
  
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    :root {
      --primary: #00c6ff;
      --primary-dark: #0073b1;
      --glow: #00c6ff;
      --background: #000;
      --text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: var(--background);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .logo-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: logoFloat 3s ease-in-out infinite;
    }

    .sirius-logo {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 18px var(--glow));
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 16px;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .command-box {
      max-width: 800px;
      width: 100%;
      margin: 16px 0;
      display: flex;
      gap: 8px;
    }

    .command-input {
      flex: 1;
      background: rgba(0, 198, 255, 0.05);
      border: 1px solid var(--glow);
      border-radius: 4px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      outline: none;
    }

    .command-input:focus {
      box-shadow: 0 0 10px var(--glow);
    }

    .command-btn {
      background: var(--glow);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 0 20px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      cursor: pointer;
    }

    .status-display {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 16px 0;
      max-width: 800px;
      width: 100%;
    }

    .status-card {
      background: rgba(0, 198, 255, 0.1);
      border: 1px solid var(--glow);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .status-label {
      font-size: 0.85rem;
      color: var(--glow);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text);
    }

    .data-stream {
      max-width: 800px;
      width: 100%;
      margin: 16px 0;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--glow);
      border-radius: 8px;
      padding: 16px;
      max-height: 250px;
      overflow-y: auto;
    }

    .data-stream-title {
      font-size: 1rem;
      color: var(--glow);
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .data-entry {
      font-size: 0.85rem;
      margin-bottom: 8px;
      padding: 8px;
      background: rgba(0, 198, 255, 0.05);
      border-left: 3px solid var(--glow);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .title { font-size: 1.6rem; }
      .status-display { grid-template-columns: 1fr; gap: 8px; }
      .command-box { flex-direction: column; }
      .command-btn { padding: 12px; }
      .logo-container { width: 140px; height: 140px; }
      .sirius-logo { width: 110px; height: 110px; }
    }
  </style>
</head>
<body>

  <div class="container" x-data="siriusInterface()" x-init="init()">
    <div class="logo-container">
      <img src="/icons/sirius-logo-animated.svg" alt="S.I.R.I.U.S. Logo" class="sirius-logo">
    </div>

    <h1 class="title">S.I.R.I.U.S.</h1>

    <form class="command-box" @submit.prevent="sendCommand()">
      <input 
        type="text" 
        class="command-input" 
        placeholder="e.g. 12 water or cal: 2026-11-01 meeting" 
        x-model="inputCommand"
      />
      <button type="button" class="command-btn" @click="startVoiceRecognition()" title="Voice Input" style="background: transparent; border: 1px solid var(--glow); color: var(--glow);">🎙️</button>
      <button type="submit" class="command-btn">EXECUTE</button>
    </form>

    <div class="status-display">
      <div class="status-card">
        <div class="status-label">Parser Engine</div>
        <div class="status-value" x-text="status.parserEngine"></div>
      </div>
      <div class="status-card">
        <div class="status-label">Request Router</div>
        <div class="status-value" x-text="status.requestRouter"></div>
      </div>
      <div class="status-card">
        <div class="status-label">Local Cache</div>
        <div class="status-value" x-text="status.localCache"></div>
      </div>
    </div>

    <div class="data-stream">
      <div class="data-stream-title">System Activity Log</div>
      <template x-for="entry in dataStream.slice().reverse()" :key="entry.id">
        <div class="data-entry" x-text="entry.message"></div>
      </template>
    </div>
  </div>

  <script>
    function siriusInterface() {
      return {
        inputCommand: '',
        status: {
          parserEngine: 'Online',
          requestRouter: 'Active',
          localCache: 'Connected'
        },
        dataStream: [],

        init() {
          this.addDataStream('System initialized');
          this.initializeWebSocket();
          this.syncSystemStatus();
        },

        async sendCommand() {
          if (!this.inputCommand.trim()) return;
          const cmd = this.inputCommand;
          this.inputCommand = '';

          try {
            const res = await fetch('/api/command', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ command: cmd })
            });

            const data = await res.json();
            if (res.ok) {
              const item = data.data;
              if (data.route === 'finances') {
                this.addDataStream(`✓ Logged ${item.type}: $${item.amount.toFixed(2)} — ${item.category}`);
              } else if (data.route === 'calendar') {
                this.addDataStream(`✓ Reminder set: "${item.title}" for ${item.date_str}`);
              } else {
                this.addDataStream(`✓ Saved successfully.`);
              }
            } else {
              this.addDataStream(`✗ ${data.detail}`);
            }
          } catch (e) {
            this.addDataStream(`✗ NETWORK ERROR: Unable to reach engine`);
          }
        },

        startVoiceRecognition() {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            this.addDataStream('✗ Voice recognition not supported on this browser');
            return;
          }

          const recognition = new SpeechRecognition();
          recognition.lang = 'en-US';
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          this.addDataStream('🎙️ Listening...');

          recognition.onresult = (event) => {
            const speechText = event.results[0][0].transcript;
            this.inputCommand = speechText;
            this.addDataStream(`✓ Heard: "${speechText}"`);
            this.sendCommand();
          };

          recognition.onerror = (event) => {
            this.addDataStream(`✗ Voice error: ${event.error}`);
          };

          recognition.start();
        },

        initializeWebSocket() {
          try {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            ws.onopen = () => this.addDataStream('WebSocket connection established');
            ws.onmessage = (event) => {
              const data = JSON.parse(event.data);
              this.addDataStream(data.message);
            };
          } catch (e) {
            this.addDataStream('WebSocket offline');
          }
        },

        async syncSystemStatus() {
          try {
            const res = await fetch('/api/status');
            if (res.ok) {
              const info = await res.json();
              this.status.requestRouter = info.status === 'online' ? 'Active' : 'Offline';
            }
          } catch (err) {
            this.status.requestRouter = 'Offline';
          }
        },

        addDataStream(message) {
          this.dataStream.push({
            id: Date.now() + Math.random(),
            message
          });
          if (this.dataStream.length > 50) this.dataStream.shift();
        }
      };
    }
  </script>
</body>
</html>
